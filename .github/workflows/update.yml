name: 유동성 대시보드 갱신
on:
  schedule:                  # 하루 5회(KST). 예약 실행이 누락돼도 다음 회차가 갱신
    - cron: '17 22 * * *'    # 07:17
    - cron: '43 23 * * *'    # 08:43
    - cron: '13 2 * * *'     # 11:13
    - cron: '37 8 * * *'     # 17:37
    - cron: '7 13 * * *'     # 22:07
  workflow_dispatch:         # Actions 탭에서 'Run workflow'로 바로 실행
permissions:
  contents: write   # data 브랜치에 원자료 올리기용
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt || (sleep 60 && pip install -r requirements.txt)
      - name: build (실패 시 3분 뒤 한 번 더)
        run: python -u build.py || (sleep 180 && python -u build.py)
        timeout-minutes: 20
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}            # 원자료 메일(보내는·받는 주소)
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}   # Gmail 앱 비밀번호(16자리)
      - name: 원자료를 data 브랜치에 올림(Claude 메일 예약 작업이 이 파일을 읽어 발송)
        run: |
          mkdir -p /tmp/rawdata && cp site/liquidity_raw.xlsx site/state.json /tmp/rawdata/
          cd /tmp/rawdata && git init -q && git checkout -q -b data
          git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "raw data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  keepalive:                 # 60일 무활동 시 예약 실행 자동 중지 방지
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
