name: 유동성 대시보드 갱신
on:
  schedule:
    - cron: '17 22 * * *'   # 매일 07:17 KST
    - cron: '43 23 * * *'   # 예비 08:43 KST (예약 실행 누락 대비)
    - cron: '13 2 * * *'    # 예비 11:13 KST
  workflow_dispatch:         # Actions 탭에서 'Run workflow'로 바로 실행
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -u build.py
        timeout-minutes: 15
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
